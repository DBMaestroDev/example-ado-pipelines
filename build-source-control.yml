# Example: Build from Source Control (Azure DevOps)
# Builds a DBmaestro package from source control by task list, commit hash, or all changes.
# Trigger manually via the Azure DevOps UI and set the required parameters.
resources:
  repositories:
    - repository: dbmaestro-cicd
      type: github
      name: DBMaestroDev/dbmaestro-cicd
      endpoint: dbmaestro-cicd  # Replace with your GitHub service connection name if different
      ref: refs/tags/v1

parameters:
  - name: packageName
    displayName: 'Package name to build'
    type: string
  - name: projectName
    displayName: 'DBmaestro project name'
    type: string
    default: 'Example-ADO'
  - name: environmentName
    displayName: 'Development environment name'
    type: string
    default: 'Development'
  - name: buildType
    displayName: 'What to include in the package'
    type: string
    values:
      - 'Specific Tasks'
      - 'Specific Commit'
    default: 'Specific Tasks'
  - name: tasksList
    displayName: 'Task IDs (comma-separated, optional - used when buildType = Specific Tasks)'
    type: string
    default: 'none'
  - name: commitHash
    displayName: 'Commit hash (optional - used when buildType = Specific Commit)'
    type: string
    default: 'none'
  - name: createDowngradeScripts
    displayName: 'Create downgrade scripts'
    type: string
    values:
      - 'False'
      - 'True'
    default: 'True'
  - name: tags
    displayName: 'Comma-separated tags to apply after build (optional, e.g., "TASK-123,TASK-456")'
    type: string
    default: 'none'
  - name: tagTypeName
    displayName: 'Tag type name'
    type: string
    default: 'Task'
  - name: agentJarPath
    type: string
    default: '$(Pipeline.Workspace)/DBmaestroAgent.jar'
  - name: runnerPool
    type: string
    default: 'dbmaestro-windows'

# Makes the run name in the ADO UI show the package/task being built
# (e.g. "TaskID-TASK-42 (20260727.2)") instead of the generic default build number.
# NOTE: build numbers can't contain ':' (or '"/<>\|?@*') - ADO rejects it.
name: 'TaskID-${{ parameters.packageName }} ($(Date:yyyyMMdd)$(Rev:.r))'

trigger: none
pr: none

stages:
  - stage: Build
    displayName: 'Build Package from Source Control'
    jobs:
      - job: BuildFromSource
        displayName: 'Build Package - ${{ parameters.packageName }}'
        pool: ${{ parameters.runnerPool }}
        steps:
          - checkout: self
            fetchDepth: 1

          - checkout: dbmaestro-cicd
            fetchDepth: 1

          - pwsh: |
              $ErrorActionPreference = "Stop"
              switch ("${{ parameters.buildType }}") {
                "Specific Tasks" {
                  if ("${{ parameters.tasksList }}" -eq "none" -or [string]::IsNullOrWhiteSpace("${{ parameters.tasksList }}")) {
                    Write-Host "##vso[task.logissue type=error]buildType is 'Specific Tasks' but tasksList is not provided"
                    exit 1
                  }
                  Write-Host "##vso[task.setvariable variable=versionType]Tasks"
                  Write-Host "##vso[task.setvariable variable=additionalInfo]${{ parameters.tasksList }}"
                }
                "Specific Commit" {
                  if ("${{ parameters.commitHash }}" -eq "none" -or [string]::IsNullOrWhiteSpace("${{ parameters.commitHash }}")) {
                    Write-Host "##vso[task.logissue type=error]buildType is 'Specific Commit' but commitHash is not provided"
                    exit 1
                  }
                  Write-Host "##vso[task.setvariable variable=versionType]Specific Commit"
                  Write-Host "##vso[task.setvariable variable=additionalInfo]${{ parameters.commitHash }}"
                }
              }
            displayName: 'Resolve Build Type Parameters'

          - template: azure-devops/templates/build-from-source.yml@dbmaestro-cicd
            parameters:
              packageName: ${{ parameters.packageName }}
              projectName: ${{ parameters.projectName }}
              envName: ${{ parameters.environmentName }}
              versionType: $(versionType)
              additionalInformation: $(additionalInfo)
              agentJarPath: ${{ parameters.agentJarPath }}
              server: $(DBMAESTRO_SERVER)
              user: $(DBMAESTRO_USER)
              password: $(DBMAESTRO_PASSWORD)
              useSsl: 'False'
              authType: 'DBmaestroAccount'
              createDowngradeScripts: ${{ parameters.createDowngradeScripts }}
              tags: ${{ parameters.tags }}
              tagTypeName: ${{ parameters.tagTypeName }}
              # CLI_VERSION pipeline variable controls JAR download. Set in pipeline Variables or a Variable Group.
              # Leave empty if the JAR is pre-installed on the runner.
              version: $(CLI_VERSION)
              useWindows: true

          - template: azure-devops/templates/precheck-package.yml@dbmaestro-cicd
            parameters:
              packageName: ${{ parameters.packageName }}
              projectName: ${{ parameters.projectName }}
              agentJarPath: ${{ parameters.agentJarPath }}
              server: $(DBMAESTRO_SERVER)
              user: $(DBMAESTRO_USER)
              password: $(DBMAESTRO_PASSWORD)
              useSsl: 'True'
              authType: 'DBmaestroAccount'
              useWindows: true