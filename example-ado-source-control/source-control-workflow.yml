# Full release workflow: triggered by every push to this repo (except
# ad-hoc/* changes, which ad-hoc-workflow.yml handles instead).
#
# This file is intentionally thin. Azure DevOps requires a self-triggered
# pipeline's YAML to live in the same repo whose pushes trigger it, so this
# file has to exist here even though all its real logic lives in exactly one
# place: azure-devops/templates/source-control-workflow.yml in the
# example-ado-pipelines repo, `extends:`-ed below. That template is shared by
# every source-control repo that needs this same release chain - if there's
# more than one source-control repo, each of the others gets an equally thin
# copy of this file (same shape, its own parameter values below). Any bug fix
# or change to the chain itself happens once, in that one template - not
# copy-pasted here. See azure-devops/templates/ad-hoc-workflow.yml's usage
# comment in that repo for the general pattern this follows.
#
# See the template for the full Build -> approvals -> upgrades chain, the
# fire-and-forget/1-parallel-job rationale, the Windows/pwsh requirement, and
# the expected commit message format ("<version>; TaskID: <value>").

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - ad-hoc/*   # ad-hoc/ changes are handled by ad-hoc-workflow.yml instead -
                   # excluded here so an ad-hoc-only commit doesn't also trigger
                   # this workflow and fail at TaskID extraction (ad-hoc commits
                   # don't follow the "<version>; TaskID: <value>" convention).
      - /*.yml   # root-level pipeline definitions (this file, ad-hoc-workflow.yml, etc.) -
                 # changes to the pipeline code itself shouldn't trigger a release run

resources:
  repositories:
    - repository: adoPipelines
      type: github
      name: DBMaestroDev/example-ado-pipelines
      endpoint: 'DBMaestroDev'  # must match the service connection name exactly - reuses the
                                 # same GitHub connection used elsewhere in this org for
                                 # example-ado-source-control; if that connection isn't scoped
                                 # to this repo too, register a separate one and update this.
      ref: refs/heads/main

extends:
  template: azure-devops/templates/source-control-workflow.yml@adoPipelines
  parameters:
    targetADOOrganization: 'https://dev.azure.com/dbmsc'
    targetADOProject: 'Example'
    dBmaestroProjectName: 'Example-ADO'
    buildPipelineId: '59'    # this repo's "Build and Precheck Package - Source Control" pipeline
    upgradePipelineId: '60'  # shared "Upgrade Environment" pipeline
    runnerPool: 'dbmaestro-windows'
