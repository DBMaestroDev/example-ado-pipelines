# Example: Upgrade Environment (Azure DevOps)
# Upgrades a DBmaestro environment on manual trigger.
# lockBehavior: sequential prevents concurrent upgrades to the same environment.

resources:
  repositories:
    - repository: dbmaestro-cicd
      type: github
      name: DBMaestroDev/dbmaestro-cicd
      endpoint: dbmaestro-cicd  # Replace with your GitHub service connection name if different
      ref: refs/heads/UseSSL_False

 #     ref: refs/tags/v1

parameters:
  - name: targetEnvironment
    displayName: 'Target environment for upgrade (manual runs)'
    type: string
    default: 'Integration'
  - name: packageNames
    displayName: 'Package names to upgrade (comma-separated, leave empty to auto-detect)'
    type: string
    default: 'none'
  - name: tagName
    displayName: 'Tag name to upgrade (use instead of packageNames)'
    type: string
    default: 'none'
  - name: projectName
    type: string
    default: 'Example-ADO'
  - name: agentJarPath
    type: string
    default: '$(Pipeline.Workspace)/DBmaestroAgent.jar'
  - name: runnerPool
    type: string
    default: 'dbmaestro-windows'

# Makes the run name in the ADO UI show the target environment and task
# (e.g. "Integration - TaskID-TASK-42 (20260727.2)") instead of the generic default build number.
# NOTE: build numbers can't contain ':' (or '"/<>\|?@*') - ADO rejects it.
name: '${{ parameters.targetEnvironment }} - TaskID-${{ parameters.packageNames }} ($(Date:yyyyMMdd)$(Rev:.r))'

stages:
  - stage: Upgrade
    displayName: 'Upgrade Environment'
    # lockBehavior: sequential ensures upgrades to the same branch are serialized
    lockBehavior: sequential
    jobs:
      - job: UpgradeEnvironment
        displayName: 'Upgrade DBmaestro Environment'
        pool: ${{ parameters.runnerPool }}
        steps:
          - checkout: self
            fetchDepth: 1

          - checkout: dbmaestro-cicd
            fetchDepth: 1

          - template: azure-devops/templates/upgrade-environment.yml@dbmaestro-cicd
            parameters:
              packageName: ${{ parameters.packageNames }}
              tagName: ${{ parameters.tagName }}
              projectName: ${{ parameters.projectName }}
              targetEnvironment: ${{ parameters.targetEnvironment }}
              agentJarPath: ${{ parameters.agentJarPath }}
              server: $(DBMAESTRO_SERVER)
              accessTokenFilePath: $(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)
              useSsl: 'False'
              useWindows: true
              # CLI_VERSION pipeline variable controls JAR download. Set in pipeline Variables or a Variable Group.
              # Leave empty if the JAR is pre-installed on the runner.
              version: $(CLI_VERSION)
