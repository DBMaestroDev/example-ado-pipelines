# Reusable "ad-hoc release" pipeline template.
# Version: 1.0.0
#
# Why this exists: ADO pipeline definitions must be registered from a file
# in the calling repo, so each source-control repo keeps a thin wrapper
# (resources + `extends:` with a `packageName` input) while all real logic
# lives here in ado-pipelines.
#
# Shape: given a `packageName` already built elsewhere, upgrades every
# environment via inline `java -jar DBmaestroAgent.jar -Upgrade ...` calls
# (no Build stage, no queued downstream pipeline). Fans out into FOUR
# independent legs - one per environment (Release Source, UAT_Env_1,
# Pre_Prod_Env_1, Prod_Env_1) - each a pre-approval -> Upgrade <env> pair,
# with all four pre-approval gates open from the start (`dependsOn: []`).
# Approving one or more gates runs just those legs, in any combination.
#
# NOTE - Windows agents:
# All steps use `pwsh:` (PowerShell 7+) rather than `bash:` - Windows agents
# don't have bash on PATH by default.

parameters:
  - name: packageName
    displayName: 'Name of the already-built package to upgrade into every environment'
    type: string
  - name: dBmaestroProjectName
    displayName: 'DBmaestro project name (used by the inline Upgrade calls)'
    type: string
  - name: agentJarPath
    displayName: 'Path to DBmaestroAgent.jar on the runner, used by the inline Upgrade calls'
    type: string
    default: 'C:\Program Files (x86)\DBmaestro\DOP Server\Agent\DBmaestroAgent.jar'
  - name: runnerPool
    displayName: 'Agent pool for this workflow''s jobs'
    type: string
    default: 'dbmaestro-windows'
  - name: releaseSourcePreApprovalEnvironment
    type: string
    default: 'Release-Source-pre-approval'
  - name: uatEnv1PreApprovalEnvironment
    type: string
    default: 'UAT_Env_1-pre-approval'
  - name: preProdEnv1PreApprovalEnvironment
    type: string
    default: 'Pre_Prod_Env_1-pre-approval'
  - name: prodEnv1PreApprovalEnvironment
    type: string
    default: 'Prod_Env_1-pre-approval'

stages:
  # ------------------------------------------------------------------
  - stage: ReleaseSourcePreApproval
    displayName: 'Release Source - Pre-Approval Gate'
    jobs:
      - deployment: ReleaseSourcePreApprovalGate
        displayName: 'Await Release Source pre-approval'
        environment: ${{ parameters.releaseSourcePreApprovalEnvironment }}
        pool: ${{ parameters.runnerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - pwsh: Write-Host "Release Source pre-approval granted - proceeding to upgrade."
                  displayName: 'Gate passed'

  # ------------------------------------------------------------------
  - stage: UpgradeReleaseSource
    displayName: 'Upgrade - Release Source'
    dependsOn: ReleaseSourcePreApproval
    condition: succeeded()
    jobs:
      - job: UpgradeReleaseSource
        pool: ${{ parameters.runnerPool }}
        steps:
          - pwsh: |
              $ErrorActionPreference = "Stop"
              java -jar "${{ parameters.agentJarPath }}" -Upgrade `
                -ProjectName "${{ parameters.dBmaestroProjectName }}" `
                -EnvName "Release Source" `
                -PackageName "${{ parameters.packageName }}" `
                -Server "$(DBMAESTRO_SERVER)" `
                -AccessTokenFilePath "$(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "##vso[task.logissue type=error]Upgrade failed for Release Source (exit code $LASTEXITCODE)."
                exit $LASTEXITCODE
              }
            displayName: 'Upgrade: Release Source'

  # ------------------------------------------------------------------
  - stage: UatEnv1PreApproval
    displayName: 'UAT_Env_1 - Pre-Approval Gate'
    # dependsOn: [] - this is its own independent leg, open from the start of
    # the run at the same time as the other three environments' pre-approval
    # gates (see the independent-legs design note at the top of this file).
    #
    # NOTE: an empty dependsOn is REQUIRED here, not optional. Azure DevOps
    # stages without an explicit dependsOn default to depending on the
    # immediately preceding stage IN THE YAML - not "no dependency" - so
    # omitting this would silently chain this stage behind
    # UpgradeReleaseSource, defeating the independent-legs design
    # (confirmed the hard way: the ADO UI showed every stage running strictly
    # left-to-right instead of each leg opening in parallel). The same
    # dependsOn: [] is repeated on PreProdEnv1PreApproval and
    # ProdEnv1PreApproval below for the same reason.
    dependsOn: []
    jobs:
      - deployment: UatEnv1PreApprovalGate
        displayName: 'Await UAT_Env_1 pre-approval'
        environment: ${{ parameters.uatEnv1PreApprovalEnvironment }}
        pool: ${{ parameters.runnerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - pwsh: Write-Host "UAT_Env_1 pre-approval granted - proceeding to upgrade."
                  displayName: 'Gate passed'

  # ------------------------------------------------------------------
  - stage: UpgradeUatEnv1
    displayName: 'Upgrade - UAT_Env_1'
    dependsOn: UatEnv1PreApproval
    condition: succeeded()
    jobs:
      - job: UpgradeUatEnv1
        pool: ${{ parameters.runnerPool }}
        steps:
          - pwsh: |
              $ErrorActionPreference = "Stop"
              java -jar "${{ parameters.agentJarPath }}" -Upgrade `
                -ProjectName "${{ parameters.dBmaestroProjectName }}" `
                -EnvName "UAT_Env_1" `
                -PackageName "${{ parameters.packageName }}" `
                -Server "$(DBMAESTRO_SERVER)" `
                -AccessTokenFilePath "$(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "##vso[task.logissue type=error]Upgrade failed for UAT_Env_1 (exit code $LASTEXITCODE)."
                exit $LASTEXITCODE
              }
            displayName: 'Upgrade: UAT_Env_1'

  # ------------------------------------------------------------------
  - stage: PreProdEnv1PreApproval
    displayName: 'Pre_Prod_Env_1 - Pre-Approval Gate'
    # dependsOn: [] - independent leg, open from the start of the run same as
    # the other three (see the UatEnv1PreApproval note above for why this
    # can't just be omitted).
    dependsOn: []
    jobs:
      - deployment: PreProdEnv1PreApprovalGate
        displayName: 'Await Pre_Prod_Env_1 pre-approval'
        environment: ${{ parameters.preProdEnv1PreApprovalEnvironment }}
        pool: ${{ parameters.runnerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - pwsh: Write-Host "Pre_Prod_Env_1 pre-approval granted - proceeding to upgrade."
                  displayName: 'Gate passed'

  # ------------------------------------------------------------------
  - stage: UpgradePreProdEnv1
    displayName: 'Upgrade - Pre_Prod_Env_1'
    dependsOn: PreProdEnv1PreApproval
    condition: succeeded()
    jobs:
      - job: UpgradePreProdEnv1
        pool: ${{ parameters.runnerPool }}
        steps:
          - pwsh: |
              $ErrorActionPreference = "Stop"
              java -jar "${{ parameters.agentJarPath }}" -Upgrade `
                -ProjectName "${{ parameters.dBmaestroProjectName }}" `
                -EnvName "Pre_Prod_Env_1" `
                -PackageName "${{ parameters.packageName }}" `
                -Server "$(DBMAESTRO_SERVER)" `
                -AccessTokenFilePath "$(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "##vso[task.logissue type=error]Upgrade failed for Pre_Prod_Env_1 (exit code $LASTEXITCODE)."
                exit $LASTEXITCODE
              }
            displayName: 'Upgrade: Pre_Prod_Env_1'

  # ------------------------------------------------------------------
  - stage: ProdEnv1PreApproval
    displayName: 'Prod_Env_1 - Pre-Approval Gate'
    # dependsOn: [] - independent leg, open from the start of the run same as
    # the other three (see the UatEnv1PreApproval note above for why this
    # can't just be omitted).
    dependsOn: []
    jobs:
      - deployment: ProdEnv1PreApprovalGate
        displayName: 'Await Prod_Env_1 pre-approval'
        environment: ${{ parameters.prodEnv1PreApprovalEnvironment }}
        pool: ${{ parameters.runnerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - pwsh: Write-Host "Prod_Env_1 pre-approval granted - proceeding to upgrade."
                  displayName: 'Gate passed'

  # ------------------------------------------------------------------
  - stage: UpgradeProdEnv1
    displayName: 'Upgrade - Prod_Env_1'
    dependsOn: ProdEnv1PreApproval
    condition: succeeded()
    jobs:
      - job: UpgradeProdEnv1
        pool: ${{ parameters.runnerPool }}
        steps:
          - pwsh: |
              $ErrorActionPreference = "Stop"
              java -jar "${{ parameters.agentJarPath }}" -Upgrade `
                -ProjectName "${{ parameters.dBmaestroProjectName }}" `
                -EnvName "Prod_Env_1" `
                -PackageName "${{ parameters.packageName }}" `
                -Server "$(DBMAESTRO_SERVER)" `
                -AccessTokenFilePath "$(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "##vso[task.logissue type=error]Upgrade failed for Prod_Env_1 (exit code $LASTEXITCODE)."
                exit $LASTEXITCODE
              }
            displayName: 'Upgrade: Prod_Env_1'
