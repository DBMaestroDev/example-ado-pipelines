              $env:AZURE_DEVOPS_EXT_PAT = $env:SYSTEM_ACCESSTOKEN

              $runId = az pipelines run `
                --organization "${{ parameters.targetADOOrganization }}" `
                --project "${{ parameters.targetADOProject }}" `
                --id "${{ parameters.upgradePipelineId }}" `
                --parameters targetEnvironment="Prod_Env_1" tagName="$(packageTag)" projectName="${{ parameters.dBmaestroProjectName }}" runnerPool="${{ parameters.runnerPool }}" `
                --query id -o tsv
              Write-Host "Queued upgrade run: $runId"
              Write-Host "Fire-and-forget: not polling for completion (see NOTE at top of file)."
              Write-Host "Before approving the next gate, confirm this run succeeded: ${{ parameters.targetADOOrganization }}/${{ parameters.targetADOProject }}/_build/results?buildId=$runId"

              # --- Polling disabled - see NOTE at top of file. ---
              # do {
              #   $state = az pipelines runs show `
              #     --organization "${{ parameters.targetADOOrganization }}" `
              #     --project "${{ parameters.targetADOProject }}" `
              #     --id "$runId" `
              #     --query state -o tsv
