# Reusable "source-control release" pipeline template.
#
# Why this exists: same reasoning as azure-devops/templates/ad-hoc-workflow.yml
# in this repo - Azure DevOps requires a self-triggered pipeline's YAML to
# live in the same repo whose pushes trigger it, so a thin trigger file still
# has to exist in every source-control repo. But with multiple source-control
# repos sharing this one ado-pipelines repo, the actual 7-stage release chain
# below lives here exactly once via `extends:`, instead of being copy-pasted
# (and re-fixed) into every source-control repo. See
# azure-devops/templates/ad-hoc-workflow.yml's usage comment for the wrapper
# file's exact shape - the wrapper for this template looks the same, just
# pointing at this file and passing buildPipelineId instead of
# adHocBuildPipelineId/packagesFolder.
#
# Chain: Build (extract TaskID from commit + queue) -> Integration
# pre-approval -> Upgrade Integration -> Integration post-approval ->
# Production pre-approval -> Upgrade Production -> Production
# post-approval. Each gate is a separate Azure DevOps Environment with a
# manual Approval check configured in the ADO UI (Pipelines -> Environments).
# Swapping the approver for any single gate never requires touching this
# file.
#
# NOTE - Windows agents:
# All steps use the `pwsh:` task (PowerShell 7+) rather than `bash:` - Windows
# agents don't have bash on PATH by default. PowerShell 7+ is a hard requirement
# here, not a fallback-able one: the dbmaestro-cicd templates these pipelines
# call (build-from-source, precheck-package, create-package, detect-packages,
# tag-package, get-cli-jar, upgrade-environment) hardcode `pwsh: true` on their
# Windows-path steps, so `powershell:` (Windows PowerShell 5.1) is NOT a valid
# substitute anywhere in this workflow - install PowerShell 7+ on the agent
# (already done on the dbmaestro-windows pool) and restart the agent service
# after installing if it's ever missing.
#
# NOTE - fire-and-forget by design, not an oversight:
# This organization has exactly 1 self-hosted parallel job and 0 granted
# Microsoft-hosted parallel jobs (confirmed via TF/CI error when we tried
# hosted pools). A job that queues a downstream pipeline and then polls it
# in a loop would hold the only available slot for the entire duration,
# so the downstream pipeline could never start - permanent deadlock.
#
# The fix: every "queue" step below only queues the downstream pipeline and
# exits immediately, releasing the slot so the downstream run can actually
# use it. There is deliberately NO automatic pass/fail check here anymore -
# that responsibility now falls to whoever approves the NEXT gate:
#   - Before approving, check that the pipeline just queued actually
#     succeeded (the Runs list, or the failure-notification email already
#     configured for the downstream build/upgrade pipelines).
#   - If it failed, REJECT the gate instead of approving it, to stop the
#     workflow here rather than letting it continue against a broken build.
# Approval gates themselves cost nothing while pending (no agent, no slot),
# which is what makes this safe with only one parallel job.
#
# Commit message format expected: "<version>; TaskID: <value>"
#   e.g. "v1.0.1; TaskID: V1.0.1"

parameters:
  - name: targetOrganization
    displayName: 'Azure DevOps organization URL that hosts the downstream pipelines'
    type: string
  - name: targetProject
    displayName: 'Azure DevOps project that hosts the downstream pipelines'
    type: string
  - name: buildPipelineId
    displayName: 'Pipeline ID of this repo''s "Build and Precheck Package - Source Control" pipeline'
    type: string
  - name: upgradePipelineId
    displayName: 'Pipeline ID of the shared "Upgrade Environment" pipeline'
    type: string
  - name: runnerPool
    displayName: 'Agent pool for both this workflow''s own jobs and the downstream pipelines it queues'
    type: string
    default: 'dbmaestro-windows'
  - name: integrationPreApprovalEnvironment
    type: string
    default: 'Integration-pre-approval'
  - name: integrationPostApprovalEnvironment
    type: string
    default: 'Integration-post-approval'
  - name: productionPreApprovalEnvironment
    type: string
    default: 'Production-pre-approval'
  - name: productionPostApprovalEnvironment
    type: string
    default: 'Production-post-approval'

stages:
  # ------------------------------------------------------------------
  - stage: Build
    displayName: 'Build Package from Commit'
    jobs:
      - job: Build
        pool: ${{ parameters.runnerPool }}
        steps:
          - checkout: self
            fetchDepth: 1

          - pwsh: |
              $ErrorActionPreference = "Stop"
              $commitMessage = git log -1 --format='%s'
              Write-Host "Message: $commitMessage"

              # Extract the TaskID value: everything after "TaskID:" up to the next ';' or end of line
              if ($commitMessage -match 'TaskID:\s*([^;]*)') {
                $taskId = $matches[1].Trim()
              } else {
                $taskId = ""
              }

              if ([string]::IsNullOrWhiteSpace($taskId)) {
                Write-Host "##vso[task.logissue type=error]Could not find 'TaskID: <value>' in commit message: $commitMessage"
                exit 1
              }

              Write-Host "TaskID resolved: $taskId"
              Write-Host "##vso[task.setvariable variable=packageName]$taskId"
              Write-Host "##vso[task.setvariable variable=packageName;isOutput=true]$taskId"
            name: extract
            displayName: 'Extract parameters from commit message'

          - pwsh: |
              $ErrorActionPreference = "Stop"
              az extension add --name azure-devops --only-show-errors
              # Authenticate via env var rather than piping into 'az devops login' -
              # on Windows, 'az' is a .cmd wrapper, and piping a token into it from
              # PowerShell unreliably loses the stdin content across that wrapper.
              $env:AZURE_DEVOPS_EXT_PAT = $env:SYSTEM_ACCESSTOKEN

              $runId = az pipelines run `
                --organization "${{ parameters.targetOrganization }}" `
                --project "${{ parameters.targetProject }}" `
                --id "${{ parameters.buildPipelineId }}" `
                --parameters packageName="$(packageName)" buildType="Specific Tasks" tasksList="$(packageName)" runnerPool="${{ parameters.runnerPool }}" `
                --query id -o tsv
              Write-Host "Queued build run: $runId"
              Write-Host "Fire-and-forget: not polling for completion (see NOTE at top of file)."
              Write-Host "Before approving the next gate, confirm this run succeeded: ${{ parameters.targetOrganization }}/${{ parameters.targetProject }}/_build/results?buildId=$runId"

              # --- Polling disabled - see NOTE at top of file. ---
              # Kept here (commented out) so it's a one-line re-enable if this
              # org ever gets a 2nd parallel job. Just uncomment and remove
              # the Write-Host lines above (except the "Queued build run" one).
              #
              # do {
              #   $state = az pipelines runs show --organization "${{ parameters.targetOrganization }}" --project "${{ parameters.targetProject }}" --id "$runId" --query state -o tsv
              #   if ($state -ne "completed") { Start-Sleep -Seconds 15 }
              # } while ($state -ne "completed")
              #
              # $result = az pipelines runs show --organization "${{ parameters.targetOrganization }}" --project "${{ parameters.targetProject }}" --id "$runId" --query result -o tsv
              # Write-Host "Build run result: $result"
              # if ($result -ne "succeeded") {
              #   Write-Host "##vso[task.logissue type=error]Build failed (result=$result). See run $runId in pipeline ${{ parameters.buildPipelineId }}."
              #   exit 1
              # }
            displayName: 'Queue: Build with Source Control (fire-and-forget)'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # ------------------------------------------------------------------
  - stage: IntegrationPreApproval
    displayName: 'Integration - Pre-Approval Gate'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: IntegrationPreApprovalGate
        displayName: 'Await Integration pre-approval'
        environment: ${{ parameters.integrationPreApprovalEnvironment }}
        pool: ${{ parameters.runnerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - pwsh: Write-Host "Integration pre-approval granted - proceeding to upgrade."
                  displayName: 'Gate passed'

  # ------------------------------------------------------------------
  - stage: UpgradeIntegration
    displayName: 'Upgrade - Integration'
    dependsOn:
      - IntegrationPreApproval
      - Build   # needed so stageDependencies.Build... resolves below - execution order is unaffected, Build already runs first
    condition: succeeded()
    variables:
      packageName: $[ stageDependencies.Build.Build.outputs['extract.packageName'] ]
    jobs:
      - job: UpgradeIntegration
        pool: ${{ parameters.runnerPool }}
        steps:
          - pwsh: |
              $ErrorActionPreference = "Stop"
              az extension add --name azure-devops --only-show-errors
              # Authenticate via env var rather than piping into 'az devops login' -
              # on Windows, 'az' is a .cmd wrapper, and piping a token into it from
              # PowerShell unreliably loses the stdin content across that wrapper.
              $env:AZURE_DEVOPS_EXT_PAT = $env:SYSTEM_ACCESSTOKEN

              $runId = az pipelines run `
                --organization "${{ parameters.targetOrganization }}" `
                --project "${{ parameters.targetProject }}" `
                --id "${{ parameters.upgradePipelineId }}" `
                --parameters targetEnvironment="Integration" packageNames="$(packageName)" runnerPool="${{ parameters.runnerPool }}" `
                --query id -o tsv
              Write-Host "Queued upgrade run: $runId"
              Write-Host "Fire-and-forget: not polling for completion (see NOTE at top of file)."
              Write-Host "Before approving the next gate, confirm this run succeeded: ${{ parameters.targetOrganization }}/${{ parameters.targetProject }}/_build/results?buildId=$runId"

              # --- Polling disabled - see NOTE at top of file. ---
              # do {
              #   $state = az pipelines runs show --organization "${{ parameters.targetOrganization }}" --project "${{ parameters.targetProject }}" --id "$runId" --query state -o tsv
              #   if ($state -ne "completed") { Start-Sleep -Seconds 15 }
              # } while ($state -ne "completed")
              #
              # $result = az pipelines runs show --organization "${{ parameters.targetOrganization }}" --project "${{ parameters.targetProject }}" --id "$runId" --query result -o tsv
              # Write-Host "Upgrade run result: $result"
              # if ($result -ne "succeeded") {
              #   Write-Host "##vso[task.logissue type=error]Integration upgrade failed (result=$result). See run $runId in pipeline ${{ parameters.upgradePipelineId }}."
              #   exit 1
              # }
            displayName: 'Queue: Upgrade Environment - Integration (fire-and-forget)'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # ------------------------------------------------------------------
  - stage: IntegrationPostApproval
    displayName: 'Integration - Post-Approval Gate'
    dependsOn: UpgradeIntegration
    condition: succeeded()
    jobs:
      - deployment: IntegrationPostApprovalGate
        displayName: 'Confirm Integration upgrade'
        environment: ${{ parameters.integrationPostApprovalEnvironment }}
        pool: ${{ parameters.runnerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - pwsh: Write-Host "Integration upgrade confirmed."
                  displayName: 'Gate passed'

  # ------------------------------------------------------------------
  - stage: ProductionPreApproval
    displayName: 'Production - Pre-Approval Gate'
    dependsOn: IntegrationPostApproval
    condition: succeeded()
    jobs:
      - deployment: ProductionPreApprovalGate
        displayName: 'Await Production pre-approval'
        environment: ${{ parameters.productionPreApprovalEnvironment }}
        pool: ${{ parameters.runnerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - pwsh: Write-Host "Production pre-approval granted - proceeding to upgrade."
                  displayName: 'Gate passed'

  # ------------------------------------------------------------------
  - stage: UpgradeProduction
    displayName: 'Upgrade - Production'
    dependsOn:
      - ProductionPreApproval
      - Build   # needed so stageDependencies.Build... resolves below - execution order is unaffected, Build already runs first
    condition: succeeded()
    variables:
      packageName: $[ stageDependencies.Build.Build.outputs['extract.packageName'] ]
    jobs:
      - job: UpgradeProduction
        pool: ${{ parameters.runnerPool }}
        steps:
          - pwsh: |
              $ErrorActionPreference = "Stop"
              az extension add --name azure-devops --only-show-errors
              # Authenticate via env var rather than piping into 'az devops login' -
              # on Windows, 'az' is a .cmd wrapper, and piping a token into it from
              # PowerShell unreliably loses the stdin content across that wrapper.
              $env:AZURE_DEVOPS_EXT_PAT = $env:SYSTEM_ACCESSTOKEN

              $runId = az pipelines run `
                --organization "${{ parameters.targetOrganization }}" `
                --project "${{ parameters.targetProject }}" `
                --id "${{ parameters.upgradePipelineId }}" `
                --parameters targetEnvironment="Production" packageNames="$(packageName)" runnerPool="${{ parameters.runnerPool }}" `
                --query id -o tsv
              Write-Host "Queued upgrade run: $runId"
              Write-Host "Fire-and-forget: not polling for completion (see NOTE at top of file)."
              Write-Host "Before approving the next gate, confirm this run succeeded: ${{ parameters.targetOrganization }}/${{ parameters.targetProject }}/_build/results?buildId=$runId"

              # --- Polling disabled - see NOTE at top of file. ---
              # do {
              #   $state = az pipelines runs show --organization "${{ parameters.targetOrganization }}" --project "${{ parameters.targetProject }}" --id "$runId" --query state -o tsv
              #   if ($state -ne "completed") { Start-Sleep -Seconds 15 }
              # } while ($state -ne "completed")
              #
              # $result = az pipelines runs show --organization "${{ parameters.targetOrganization }}" --project "${{ parameters.targetProject }}" --id "$runId" --query result -o tsv
              # Write-Host "Upgrade run result: $result"
              # if ($result -ne "succeeded") {
              #   Write-Host "##vso[task.logissue type=error]Production upgrade failed (result=$result). See run $runId in pipeline ${{ parameters.upgradePipelineId }}."
              #   exit 1
              # }
            displayName: 'Queue: Upgrade Environment - Production (fire-and-forget)'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # ------------------------------------------------------------------
  - stage: ProductionPostApproval
    displayName: 'Production - Post-Approval Gate (Finalize)'
    dependsOn: UpgradeProduction
    condition: succeeded()
    jobs:
      - deployment: ProductionPostApprovalGate
        displayName: 'Finalize workflow'
        environment: ${{ parameters.productionPostApprovalEnvironment }}
        pool: ${{ parameters.runnerPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - pwsh: Write-Host "Production upgrade confirmed. Workflow complete."
                  displayName: 'Gate passed'
