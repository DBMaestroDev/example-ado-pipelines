# Example: Build with Git Change Detection (Azure DevOps)
# Detects which packages changed in the example-ado-source-control repo and builds them.
#
# Detection runs against example-ado-source-control, NOT this pipeline's own
# self repo (example-ado-pipelines) - self only holds pipeline definitions,
# not the ad-hoc/ package folder being diffed. example-ado-source-control is
# checked out as a second repository resource below, same pattern as
# dbmaestro-cicd, and both the Detect and Build stages are pointed at that
# checkout path explicitly via sourcesPath/sourcesRepository parameters.
#
# Checkout folder naming (confirmed empirically, see NOTE in Detect stage):
# every repo lands in a subfolder of $(Build.SourcesDirectory) named after its
# actual repository name (DBMaestroDev/example-ado-source-control -> folder
# "example-ado-source-control"), not the `repository:` alias declared below.
resources:
  repositories:
    - repository: dbmaestro-cicd
      type: github
      name: DBMaestroDev/dbmaestro-cicd
      endpoint: dbmaestro-cicd  # Replace with your GitHub service connection name if different
      ref: refs/heads/UseSSL_False
      #ref: refs/tags/v1
    - repository: exampleAdoSourceControl
      type: github
      name: DBMaestroDev/example-ado-source-control
      endpoint: 'DBMaestroDev'  # must match the service connection name exactly
      ref: refs/heads/main

parameters:
  - name: projectName
    type: string
    default: 'Example-ADO'
  - name: packagesFolder
    type: string
    default: 'ad-hoc'
  - name: agentJarPath
    type: string
    default: '$(Pipeline.Workspace)/DBmaestroAgent.jar'
  - name: runnerPool
    type: string
    default: 'dbmaestro-windows'
  - name: baseBranch
    displayName: 'Base branch to compare against (manual runs) - currently unused, see NOTE in Detect stage'
    type: string
    default: 'main'
  - name: tags
    displayName: 'Comma-separated tags to apply after build (optional, e.g., "TASK-123,TASK-456")'
    type: string
    default: 'none'
  - name: tagTypeName
    displayName: 'Tag type name'
    type: string
    default: 'Task'
trigger: none

stages:
  - stage: Detect
    displayName: 'Detect Changed Packages'
    jobs:
      - job: DetectChanges
        displayName: 'Detect Changed Packages'
        pool: ${{ parameters.runnerPool }}
        steps:
          # No fetchDepth here - omitting it entirely is what actually gets
          # full history for this repository resource. Explicit fetchDepth: 0
          # is *documented* to also mean "full history", but for this GitHub
          # resource type it was observed to still only fetch 1 commit
          # ("error: Could not access 'HEAD~1'") - likely getting passed
          # through literally as --depth=0 rather than being special-cased to
          # "omit --depth". Leaving fetchDepth unset avoids that path entirely.
          #
          # Confirmed via the DEBUG step below: self (example-ado-pipelines) is
          # checked out automatically even with no explicit `checkout: self`
          # step, and every repo (including this one) lands in a subfolder of
          # $(Build.SourcesDirectory) named after the repository's actual name
          # (the basename of `name:` above) - NOT the `repository:` alias used
          # for the checkout step/template refs. That's why sourcesPath below
          # is ".../example-ado-source-control", not ".../exampleAdoSourceControl".
          - checkout: exampleAdoSourceControl

          - checkout: dbmaestro-cicd
            fetchDepth: 1

          # DEBUG: print where things actually landed, to confirm/adjust the
          # sourcesPath assumption below. Safe to remove once checkout layout
          # is confirmed stable.
          - pwsh: |
              Write-Host "Build.SourcesDirectory = $(Build.SourcesDirectory)"
              Write-Host "--- Contents of Build.SourcesDirectory ---"
              Get-ChildItem -Force "$(Build.SourcesDirectory)" | Select-Object Name, Mode | Format-Table | Out-String | Write-Host
              Write-Host "--- Current location ---"
              Get-Location
            displayName: 'DEBUG: List checkout contents'

          # detectFromPush (not baseRef) is the correct mode here: this checkout
          # is always 'main' itself (the ref: on the repository resource above),
          # so comparing it against "origin/main" would just be main vs. main -
          # always empty, even ignoring that the ref may not resolve at all in
          # this checkout. detectFromPush instead diffs HEAD~1 vs HEAD, i.e.
          # exactly the commit that made ad-hoc-workflow.yml queue this run.
          - template: azure-devops/templates/detect-packages.yml@dbmaestro-cicd
            parameters:
              detectFromPush: true
              useWindows: true
              sourcesPath: '$(Build.SourcesDirectory)/example-ado-source-control'

  - stage: Build
    displayName: 'Build Changed Packages'
    dependsOn: Detect
    jobs:
      - template: azure-devops/templates/build-multiple-packages.yml@dbmaestro-cicd
        parameters:
          packageNames: ''
          projectName: ${{ parameters.projectName }}
          packagesFolder: ${{ parameters.packagesFolder }}
          agentJarPath: ${{ parameters.agentJarPath }}
          server: $(DBMAESTRO_SERVER)
          accessTokenFilePath: $(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)
          useSsl: 'True'
          packageType: 'AdHoc'
          runnerPool: ${{ parameters.runnerPool }}
          useWindows: true
          sourcesRepository: exampleAdoSourceControl
          sourcesPath: '$(Build.SourcesDirectory)/example-ado-source-control'
          # CLI_VERSION pipeline variable controls JAR download. Set in pipeline Variables or a Variable Group.
          # Leave empty if the JAR is pre-installed on the runner.
          version: $(CLI_VERSION)
          tags: ${{ parameters.tags }}
          tagTypeName: ${{ parameters.tagTypeName }}
