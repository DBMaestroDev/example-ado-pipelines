# Example: Build with Git Change Detection (Azure DevOps)
# Detects which packages changed in the example-ado-source-control repo and builds them.
#
# Detection runs against example-ado-source-control, NOT this pipeline's own
# self repo (example-ado-pipelines) - self only holds pipeline definitions,
# not the ad-hoc/ package folder being diffed. example-ado-source-control is
# checked out as a second repository resource below, same pattern as
# dbmaestro-cicd, and both the Detect and Build stages are pointed at that
# checkout path explicitly via sourcesPath/sourcesRepository parameters.
#
# sourceRepoRef CANNOT be used to parameterize resources.repositories
# below - Azure Pipelines resolves repository resources (name/endpoint/ref)
# before runtime parameter values are bound,
# so a template expression there always fails to compile ("A template
# expression is not allowed in this context"). Only a finite, predefined set
# of source repos is supported (each its own static resource below), all
# under the same fixed org (DBMaestroDev). sourceRepoName IS usable as the
# `checkout:` step's repository alias though, since parameters are
# compile-time - each resources.repositories entry below is aliased to
# exactly its actual repo name, so PrepareSources just does
# `checkout: ${{ parameters.sourceRepoName }}` with no if/elseif chain
# needed. To support another repo: add a new resources.repositories entry
# (with its own service connection) aliased to that repo's actual name.
#
# sourceRepoRef stays fully dynamic despite the above: PrepareSources checks
# out whichever static resource was selected, then reuses its persisted git
# credentials to fetch/checkout the actual requested ref via script (the same
# idiom this file already used for `git fetch --unshallow`). Each predefined
# repo's service connection is fixed in its own resources.repositories entry
# (there is no runtime-parameterized endpoint anymore).
#
# Checkout folder naming (confirmed empirically): every repo lands in a
# subfolder of $(Build.SourcesDirectory) named after its actual repository
# name (DBMaestroDev/example-ado-source-control -> folder
# "example-ado-source-control"), not the `repository:` alias declared below.
#
# The Build stage's build-multiple-packages.yml@dbmaestro-cicd template does
# its own internal `checkout: ${{ parameters.sourcesRepository }}` step, but
# its build steps run with workingDirectory: sourcesPath, decoupled from
# where that checkout lands. Re-checking-out the selected source repo there
# would reset it to the resource's default ref, clobbering the ref
# PrepareSources already switched to - so the Build stage instead points
# sourcesRepository at the harmless, already-checked-out dbmaestro-cicd
# resource, and relies on sourcesPath (prepared once by PrepareSources) for
# the real content.
#
# packageNames parameter: when a caller (e.g. ad-hoc-workflow.yml) has already
# run its own git-diff detection, it can pass the result straight in via
# packageNames, which skips the Detect stage here entirely rather than
# detecting the same push twice. Leave packageNames empty for a standalone/
# manual run of this pipeline, and it detects changes itself as before.
resources:
  repositories:
    - repository: dbmaestro-cicd
      type: github
      name: DBMaestroDev/dbmaestro-cicd
      endpoint: dbmaestro-cicd  # Replace with your GitHub service connection name if different
      ref: refs/tags/v1
    # Repository alias below MUST equal the actual repo name (the part after
    # the org/) - PrepareSources selects between these via
    # `checkout: ${{ parameters.sourceRepoName }}`, which resolves the alias
    # directly from the sourceRepoName parameter value.
    - repository: example-ado-source-control
      type: github
      name: DBMaestroDev/example-ado-source-control
      endpoint: dbmaestro-cicd  # must match the service connection name exactly
      ref: refs/heads/main
    # Second example source repo, purely to demonstrate how to add one:
    # replace name/endpoint with a real org/repo + service connection to
    # actually use it.
    - repository: example-ado-source-control-2
      type: github
      name: DBMaestroDev/example-ado-source-control-2
      endpoint: dbmaestro-cicd  # replace if the second repo needs a different service connection
      ref: refs/heads/main

parameters:
  - name: projectName
    type: string
  - name: sourceRepoName
    displayName: 'Source repo name (org is always DBMaestroDev) to detect changes in and check out for the build - must match the repository alias of one of the static resources.repositories entries above (example-ado-source-control or example-ado-source-control-2 today), used directly as the PrepareSources stage checkout alias'
    type: string
    default: ''
  - name: sourceRepoRef
    displayName: 'Git ref of the source repo to check out'
    type: string
    default: 'refs/heads/main'
  - name: packagesFolder
    type: string
    default: 'ad-hoc'
  - name: packageNames
    displayName: 'Comma-separated package names to build directly (optional). When set, the Detect stage is skipped entirely - use this when the caller has already run its own git-diff detection (e.g. ad-hoc-workflow.yml) and knows exactly what changed, so detection is not redundantly run twice. Leave empty to have this pipeline detect changes itself (e.g. for a manual/standalone run).'
    type: string
    default: ''
  - name: agentJarPath
    type: string
    default: 'C:\Program Files (x86)\DBmaestro\DOP Server\Agent\DBmaestroAgent.jar'
  - name: runnerPool
    type: string
    default: 'dbmaestro-windows'
  - name: baseBranch
    displayName: 'Base branch to compare against (manual runs) - currently unused, see NOTE in Detect stage'
    type: string
    default: 'main'
  - name: tags
    displayName: 'Comma-separated tags to apply after build (optional, e.g., "TASK-123,TASK-456")'
    type: string
    default: 'none'
  - name: tagTypeName
    displayName: 'Tag type name'
    type: string
    default: 'Task'
trigger: none

stages:
  # Always runs (even when packageNames skips Detect below) - this is the
  # only place that checks out the selected source repo. It exists because the
  # Build stage's build-multiple-packages.yml@dbmaestro-cicd template does its
  # own internal checkout of whatever `sourcesRepository` alias it's given,
  # which would reset HEAD back to the static resource's default ref
  # (refs/heads/main) if pointed at the source repo directly -
  # clobbering the ref switch below. So Build instead points sourcesRepository
  # at the harmless dbmaestro-cicd resource and relies on this stage having
  # already prepared the real content at sourcesPath.
  - stage: PrepareSources
    displayName: 'Prepare Source Repo Checkout'
    jobs:
      - job: Prepare
        displayName: 'Checkout Source Repo At Requested Ref'
        pool: ${{ parameters.runnerPool }}
        steps:
          # The repository alias to check out is picked at compile time by
          # feeding sourceRepoName straight in as the checkout alias - this
          # works because every resources.repositories entry above is
          # aliased to exactly its actual repo name, matching what
          # sourceRepoName is documented to contain. If sourceRepoName
          # doesn't match any declared alias, this fails to compile with a
          # "repository resource ... not found"-style error. To support a
          # third repo: add a matching resources.repositories entry above,
          # aliased to that repo's actual name.
          #
          # No fetchDepth on this checkout - omitting it entirely is what
          # actually gets full history for this repository resource. Explicit
          # fetchDepth: 0 is *documented* to also mean "full history", but for
          # this GitHub resource type it was observed to still only fetch 1
          # commit either way ("fatal: ambiguous argument 'HEAD~1': unknown
          # revision"). See the explicit `git fetch --unshallow` step below,
          # which is the real fix, not just a fallback.
          - checkout: ${{ parameters.sourceRepoName }}
            persistCredentials: true   # needed so the later scripted 'git fetch'
                                        # steps below can authenticate - checkout
                                        # credentials aren't persisted to later
                                        # steps by default, and without this the
                                        # fetch fails with "terminal prompts disabled"

          # This is the actual fix for the shallow-checkout behavior noted
          # above, not just a defensive fallback: force full history so
          # HEAD~1 resolves for the detectFromPush diff in the Detect stage.
          # --unshallow errors harmlessly ("does not make sense") if the repo
          # already has full history, so this is safe to always run
          # regardless. Then, since the repository resource's `ref:` is
          # necessarily static (refs/heads/main), move HEAD to whatever ref
          # was actually requested at queue time - reusing the credentials
          # persisted above rather than needing a separate PAT/service
          # connection for this second fetch. $repoFolder is just
          # sourceRepoName itself now - the checkout folder is named after the
          # actual repo name (see the checkout-folder-naming note above), and
          # sourceRepoName is documented to already be that same repo name.
          # Published as a stage output variable so Detect/Build can build
          # their own sourcesPath without duplicating this logic.
          - pwsh: |
              $repoFolder = "${{ parameters.sourceRepoName }}"
              $path = "$(Build.SourcesDirectory)/$repoFolder"
              Set-Location $path
              git fetch --unshallow 2>&1 | Write-Host
              $LASTEXITCODE = 0
              git fetch origin ${{ parameters.sourceRepoRef }} 2>&1 | Write-Host
              git checkout FETCH_HEAD 2>&1 | Write-Host
              Write-Host "Commit count after ref switch: $(git rev-list --count HEAD)"
              Write-Host "##vso[task.setvariable variable=sourcesPath;isOutput=true]$path"
            name: PrepareRef
            displayName: 'Ensure full git history, check out requested ref, and resolve sourcesPath'

  # Skipped entirely when the caller already passed packageNames - see that
  # parameter's description above.
  - ${{ if eq(parameters.packageNames, '') }}:
      - stage: Detect
        displayName: 'Detect Changed Packages'
        dependsOn: PrepareSources
        variables:
          sourcesPath: $[ stageDependencies.PrepareSources.Prepare.outputs['PrepareRef.sourcesPath'] ]
        jobs:
          - job: DetectChanges
            displayName: 'Detect Changed Packages'
            pool: ${{ parameters.runnerPool }}
            steps:
              - checkout: dbmaestro-cicd
                fetchDepth: 1

              # detectFromPush (not baseRef) is the correct mode here: this checkout
              # is always 'main' itself (the ref: on the repository resource above),
              # so comparing it against "origin/main" would just be main vs. main -
              # always empty, even ignoring that the ref may not resolve at all in
              # this checkout. detectFromPush instead diffs HEAD~1 vs HEAD, i.e.
              # exactly the commit that made ad-hoc-workflow.yml queue this run.
              - template: azure-devops/templates/detect-packages.yml@dbmaestro-cicd
                parameters:
                  detectFromPush: true
                  useWindows: true
                  sourcesPath: '$(sourcesPath)'  # resolved by PrepareSources - varies by which repo was selected
                  # Must match the Build stage's packagesFolder below (both default
                  # to 'ad-hoc') - detect-packages.ps1/.sh match changed files as
                  # "<packagesFolder>/<packageName>/...", so if these two ever
                  # diverge, detection silently finds nothing even though files
                  # genuinely changed (this is exactly what happened when the
                  # template still hardcoded "packages/" - see dbmaestro-cicd).
                  packagesFolder: ${{ parameters.packagesFolder }}

  - stage: Build
    displayName: 'Build Changed Packages'
    dependsOn:
      - PrepareSources
      - ${{ if eq(parameters.packageNames, '') }}:
          - Detect
    variables:
      sourcesPath: $[ stageDependencies.PrepareSources.Prepare.outputs['PrepareRef.sourcesPath'] ]
    jobs:
      - template: azure-devops/templates/build-multiple-packages.yml@dbmaestro-cicd
        parameters:
          packageNames: ${{ parameters.packageNames }}
          projectName: ${{ parameters.projectName }}
          packagesFolder: ${{ parameters.packagesFolder }}
          agentJarPath: ${{ parameters.agentJarPath }}
          server: $(DBMAESTRO_SERVER)
          accessTokenFilePath: $(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)
          useSsl: 'False'
          packageType: 'AdHoc'
          runnerPool: ${{ parameters.runnerPool }}
          useWindows: true
          sourcesRepository: dbmaestro-cicd
          sourcesPath: '$(sourcesPath)'  # resolved by PrepareSources - varies by which repo was selected
          # CLI_VERSION pipeline variable controls JAR download. Set in pipeline Variables or a Variable Group.
          # Leave empty if the JAR is pre-installed on the runner.
          version: $(CLI_VERSION)
          tags: ${{ parameters.tags }}
          tagTypeName: ${{ parameters.tagTypeName }}
