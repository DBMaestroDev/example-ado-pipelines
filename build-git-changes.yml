# Example: Build with Git Change Detection (Azure DevOps)
# Detects which packages changed in the example-ado-source-control repo and builds them.
#
# Detection runs against example-ado-source-control, NOT this pipeline's own
# self repo (example-ado-pipelines) - self only holds pipeline definitions,
# not the ad-hoc/ package folder being diffed. example-ado-source-control is
# checked out as a second repository resource below, same pattern as
# dbmaestro-cicd, and both the Detect and Build stages are pointed at that
# checkout path explicitly via sourcesPath/sourcesRepository parameters.
resources:
  repositories:
    - repository: dbmaestro-cicd
      type: github
      name: DBMaestroDev/dbmaestro-cicd
      endpoint: dbmaestro-cicd  # Replace with your GitHub service connection name if different
      ref: refs/heads/UseSSL_False
      #ref: refs/tags/v1
    - repository: exampleAdoSourceControl
      type: github
      name: DBMaestroDev/example-ado-source-control
      endpoint: 'DBMaestroDev'  # must match the service connection name exactly
      ref: refs/heads/main

parameters:
  - name: projectName
    type: string
    default: 'Example-ADO'
  - name: packagesFolder
    type: string
    default: 'ad-hoc'
  - name: agentJarPath
    type: string
    default: '$(Pipeline.Workspace)/DBmaestroAgent.jar'
  - name: runnerPool
    type: string
    default: 'dbmaestro-windows'
  - name: baseBranch
    displayName: 'Base branch to compare against (manual runs)'
    type: string
    default: 'main'
  - name: tags
    displayName: 'Comma-separated tags to apply after build (optional, e.g., "TASK-123,TASK-456")'
    type: string
    default: 'none'
  - name: tagTypeName
    displayName: 'Tag type name'
    type: string
    default: 'Task'
trigger: none

stages:
  - stage: Detect
    displayName: 'Detect Changed Packages'
    jobs:
      - job: DetectChanges
        displayName: 'Detect Changed Packages'
        pool: ${{ parameters.runnerPool }}
        steps:
          - checkout: exampleAdoSourceControl
            fetchDepth: 0

          - checkout: dbmaestro-cicd
            fetchDepth: 1

          - template: azure-devops/templates/detect-packages.yml@dbmaestro-cicd
            parameters:
              isPullRequest: false
              baseRef: ${{ parameters.baseBranch }}
              detectFromPush: false
              useWindows: true
              sourcesPath: '$(Build.SourcesDirectory)'

  - stage: Build
    displayName: 'Build Changed Packages'
    dependsOn: Detect
    jobs:
      - template: azure-devops/templates/build-multiple-packages.yml@dbmaestro-cicd
        parameters:
          packageNames: ''
          projectName: ${{ parameters.projectName }}
          packagesFolder: ${{ parameters.packagesFolder }}
          agentJarPath: ${{ parameters.agentJarPath }}
          server: $(DBMAESTRO_SERVER)
          accessTokenFilePath: $(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)
          useSsl: 'True'
          packageType: 'AdHoc'
          runnerPool: ${{ parameters.runnerPool }}
          useWindows: true
          sourcesRepository: exampleAdoSourceControl
          sourcesPath: '$(Build.SourcesDirectory)'
          # CLI_VERSION pipeline variable controls JAR download. Set in pipeline Variables or a Variable Group.
          # Leave empty if the JAR is pre-installed on the runner.
          version: $(CLI_VERSION)
          tags: ${{ parameters.tags }}
          tagTypeName: ${{ parameters.tagTypeName }}
